services:
  pob-flatpak:
    build:
      context: .
      dockerfile: Dockerfile.flatpak.runner
    image: ${POB_FLATPAK_RUNNER_IMAGE:-pob-flatpak-runner:local}
    container_name: pob-flatpak-rdp
    privileged: true
    environment:
      BUILD_DIR: /data/builds
      POB_RDP_PASSWORD: ${POB_RDP_PASSWORD:-changeme}
      POB_RDP_PORT: ${POB_FLATPAK_RDP_PORT:-3389}
      POB_RDP_KEYLAYOUT: ${POB_RDP_KEYLAYOUT:-0x00000409}
      POB_FLATPAK_APP_ID: ${POB_FLATPAK_APP_ID:-community.pathofbuilding.PathOfBuilding}
      POB_FLATPAK_GAME: ${POB_FLATPAK_GAME:-poe1}
      POB_FLATPAK_LOCAL_REMOTE: ${POB_FLATPAK_LOCAL_REMOTE:-localrepo}
      POB_FLATPAK_REPO_DIR: /repo
    ports:
      - "${POB_FLATPAK_RDP_PORT:-3389}:3389"
    volumes:
      - ./.cache/flatpak/repo:/repo:ro
      - ./.cache/flatpak/state/system:/var/lib/flatpak
      - ./.cache/flatpak/state/home:/root
      - ${POB_BUILDS_HOST_DIR:-/Users/sergio/Documents/30_HOBBY_AI/POB-data/builds}:/data/builds
